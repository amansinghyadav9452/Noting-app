<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Notes App</h1>
    <p class="creator">Made by Aman</p>

    <!-- Title -->
    <div class="input-group">
      <label>Enter Title</label>
      <input type="text" id="title" placeholder="Enter note title">
    </div>

    <!-- Reminder -->
    <div class="input-group">
      <label>Set Reminder</label>
      <input type="datetime-local" id="reminder">
    </div>

    <!-- Notes -->
    <div class="input-group">
      <label>Write Notes</label>
      <textarea id="content" placeholder="Write your notes here..."></textarea>
    </div>

    <!-- Button -->
    <button onclick="addNote()">Save Note</button>

    <!-- Notes display -->
    <div id="notesContainer"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
